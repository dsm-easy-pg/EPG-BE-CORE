spring:
  application:
    name: epg

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}

jwt:
  expiration_time: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh_expiration_time: ${JWT_REFRESH_EXPIRATION:1209600000}
  secret: ${JWT_SECRET}
