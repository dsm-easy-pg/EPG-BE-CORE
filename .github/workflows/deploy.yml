name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/epg-be-core:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/epg-be-core:${{ github.sha }}

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/root/epg' }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          output=$({ sleep 3; printf '%s\n' \
            "cd '$DEPLOY_DIR'" \
            "docker compose pull" \
            "docker compose up -d" \
            "docker compose ps" \
            "echo DEPLOY_DONE_\$((6*7))" \
            "exit"; } \
            | sshpass -p "$SSH_PASSWORD" ssh -tt -o StrictHostKeyChecking=no \
                -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST")
          echo "$output"
          echo "$output" | grep -q 'DEPLOY_DONE_42'
