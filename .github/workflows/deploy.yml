name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/epg-be-core:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/epg-be-core:${{ github.sha }}

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/root/epg' }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          JPA_DDL_AUTO: ${{ secrets.JPA_DDL_AUTO }}
          JPA_SHOW_SQL: ${{ secrets.JPA_SHOW_SQL }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          COOKIE_SAME_SITE: ${{ secrets.COOKIE_SAME_SITE }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          compose_b64=$(base64 -w0 docker-compose.yml)
          env_b64=$(printf '%s\n' \
            "MYSQL_DATABASE=$MYSQL_DATABASE" \
            "MYSQL_USER=$MYSQL_USER" \
            "MYSQL_PASSWORD=$MYSQL_PASSWORD" \
            "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" \
            "REDIS_PASSWORD=$REDIS_PASSWORD" \
            "JWT_SECRET=$JWT_SECRET" \
            "JWT_ACCESS_EXPIRATION=$JWT_ACCESS_EXPIRATION" \
            "JWT_REFRESH_EXPIRATION=$JWT_REFRESH_EXPIRATION" \
            "API_KEY_SECRET=$API_KEY_SECRET" \
            "JPA_DDL_AUTO=$JPA_DDL_AUTO" \
            "JPA_SHOW_SQL=$JPA_SHOW_SQL" \
            "COOKIE_SECURE=$COOKIE_SECURE" \
            "COOKIE_SAME_SITE=$COOKIE_SAME_SITE" \
            | base64 -w0)

          output=$(printf '%s\n' \
            "mkdir -p '$DEPLOY_DIR'" \
            "cd '$DEPLOY_DIR'" \
            "printf %s '$compose_b64' | base64 -d > docker-compose.yml" \
            "printf %s '$env_b64' | base64 -d > .env" \
            "docker compose pull" \
            "docker compose up -d" \
            "docker compose ps" \
            "echo DEPLOY_DONE_\$((6*7))" \
            "exit" \
            | sshpass -p "$SSH_PASSWORD" ssh -tt -o StrictHostKeyChecking=no \
                -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST")
          echo "$output"
          echo "$output" | grep -q 'DEPLOY_DONE_42'
